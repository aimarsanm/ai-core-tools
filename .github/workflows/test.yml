name: Tests

on:
  push:
    # Feature/fix branches are covered by pull_request runs. Keeping push
    # builds for shared branches avoids running the same commit twice.
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
jobs:
  # -------------------------------------------------------------------------
  # Backend unit tests (no DB required — pure Python)
  # -------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (including test group)
        run: poetry install --with test --no-interaction

      - name: Run unit tests (no DB needed)
        run: |
          poetry run pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --no-cov-on-fail
        env:
          AICT_LOGIN: LOCAL
          SQLALCHEMY_DATABASE_URI: postgresql://test_user:test_pass@localhost:5433/test_db
          SECRET_KEY: ci-test-secret-key-32chars-minimum
          AICT_OMNIADMINS: admin@test.com
          AICT_MODE: SELF-HOSTED
          FRONTEND_URL: http://localhost:5173
          REPO_BASE_FOLDER: /tmp/test_repos

      - name: Upload unit test coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          flags: unit
          name: unit-tests
        continue-on-error: true

      - name: Store coverage report for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # -------------------------------------------------------------------------
  # Backend integration tests (real PostgreSQL with pgvector)
  # -------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: false  # Temporarily disabled until we optimize the test suite and reduce flakiness

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass  # pragma: allowlist secret
        ports:
          - "5433:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies (including test group)
        run: poetry install --with test --no-interaction

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5433 -U test_user && break
            echo "Waiting for PostgreSQL... ($i/20)"
            sleep 2
          done

      - name: Run integration tests
        run: |
          poetry run pytest tests/integration/ \
            -v \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage-integration.xml \
            --no-cov-on-fail
        env:
          AICT_LOGIN: LOCAL
          SQLALCHEMY_DATABASE_URI: postgresql://test_user:test_pass@localhost:5433/test_db
          SECRET_KEY: ci-test-secret-key-32chars-minimum
          AICT_OMNIADMINS: admin@test.com
          AICT_MODE: SELF-HOSTED
          FRONTEND_URL: http://localhost:5173
          REPO_BASE_FOLDER: /tmp/test_repos

      - name: Upload integration test coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage-integration.xml
          flags: integration
          name: integration-tests
        continue-on-error: true

  # -------------------------------------------------------------------------
  # Frontend lint (placeholder — tests added in Phase 5)
  # -------------------------------------------------------------------------
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      - name: Fetch Sonar PR Summary Metrics
        id: fetch_metrics
        if: always() && github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: "lks-ot-i-plus-d_mattin-ai"
          PULL_REQUEST_KEY: ${{ github.event.pull_request.number }}
        run: |
          # 1. Consultar estado del Quality Gate
          QG_RESP=$(curl -s -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${PROJECT_KEY}&pullRequest=${PULL_REQUEST_KEY}")

          STATUS=$(echo "$QG_RESP" | jq -r '.projectStatus.status // "UNKNOWN"')

          if [ "$STATUS" == "OK" ]; then
            echo "GATE_HEADER=✅ Quality Gate passed" >> $GITHUB_ENV
          else
            echo "GATE_HEADER=❌ Quality Gate failed" >> $GITHUB_ENV
          fi

          # 2. Consultar las 6 métricas del PR Summary
          METRIC_KEYS="new_violations,new_accepted_issues,new_coverage,new_duplicated_lines_density,new_security_hotspots,software_quality_high_issues"
          
          METRICS_RESP=$(curl -s -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/measures/component?component=${PROJECT_KEY}&pullRequest=${PULL_REQUEST_KEY}&metricKeys=${METRIC_KEYS}")

          # Extraer cada una con fallback si viene vacía o no hay suficiente código
          NEW_ISSUES=$(echo "$METRICS_RESP" | jq -r '.component.measures[]? | select(.metric=="new_violations") | .period.value // "0"')
          ACCEPTED_ISSUES=$(echo "$METRICS_RESP" | jq -r '.component.measures[]? | select(.metric=="new_accepted_issues") | .period.value // "0"')
          COVERAGE=$(echo "$METRICS_RESP" | jq -r '.component.measures[]? | select(.metric=="new_coverage") | .period.value // "There are not enough lines to compute coverage"')
          DUPLICATIONS=$(echo "$METRICS_RESP" | jq -r '.component.measures[]? | select(.metric=="new_duplicated_lines_density") | .period.value // "-"')
          SECURITY_HOTSPOTS=$(echo "$METRICS_RESP" | jq -r '.component.measures[]? | select(.metric=="new_security_hotspots") | .period.value // "0"')
          DEPENDENCY_RISKS=$(echo "$METRICS_RESP" | jq -r '.component.measures[]? | select(.metric=="software_quality_high_issues") | .period.value // "0"')

          # Formatear porcentajes si son números
          if [[ "$COVERAGE" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            COVERAGE="${COVERAGE}%"
          fi
          if [[ "$DUPLICATIONS" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            DUPLICATIONS="${DUPLICATIONS}%"
          fi

          # Pasar variables al entorno de GitHub Actions
          echo "M_NEW_ISSUES=${NEW_ISSUES}" >> $GITHUB_ENV
          echo "M_ACCEPTED_ISSUES=${ACCEPTED_ISSUES}" >> $GITHUB_ENV
          echo "M_COVERAGE=${COVERAGE}" >> $GITHUB_ENV
          echo "M_DUPLICATIONS=${DUPLICATIONS}" >> $GITHUB_ENV
          echo "M_SECURITY_HOTSPOTS=${SECURITY_HOTSPOTS}" >> $GITHUB_ENV
          echo "M_DEPENDENCY_RISKS=${DEPENDENCY_RISKS}" >> $GITHUB_ENV

      - name: Comment PR with Sonar Summary Table
        if: always() && github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ### ${{ env.GATE_HEADER }}

            | Metric | Value |
            | :--- | :--- |
            | 🐞 **New Issues** | ${{ env.M_NEW_ISSUES }} |
            | 👁️ **Accepted Issues** | ${{ env.M_ACCEPTED_ISSUES }} |
            | 📊 **Coverage** | ${{ env.M_COVERAGE }} |
            | 📋 **Duplications** | ${{ env.M_DUPLICATIONS }} |
            | 🔒 **Security Hotspots** | ${{ env.M_SECURITY_HOTSPOTS }} |
            | 📦 **Dependency Risks** | ${{ env.M_DEPENDENCY_RISKS }} |

          comment_tag: sonarqube_results
